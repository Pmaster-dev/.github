  - component:
      canonical_name: DeafAUTH Identity Cortex
      aliases:
        - deafauth-api
        - DeafAUTH
        - Identity Cortex
      definitions:
        - repository: municipal-dao-v
          path: services/deafauth-api/src/server.ts
          purpose: Core authentication, profile management, and community verification engine for Deaf-first profiles.
          evidence: Active Express.js application querying Firestore and caching tokens in Redis.
        - repository: deafauth
          path: app/
          purpose: Reference Next.js web application for prompt-based identity onboarding.
          evidence: Next.js pages, custom hooks, and Supabase integration logic.
        - repository: deaf-first-platform
          path: Services/deafauth
          purpose: OpenAPI spec definition and routes reference.
          evidence: Detailed OpenAPI 3.1 schema.
      dependencies:
        - Firestore ("deafauth-profiles" database)
        - Redis ("deafauth-redis")
        - GCP Pub/Sub ("deafauth-events", "deafauth-verifications" topics)
      consumers:
        - pinksync-middleware
        - mbtq-platform
        - mbtquniverse-dao
        - 360magicians-vertex-ai
      providers:
        - lib/deafauth-sdk.ts (Client SDK)
      APIs:
        - POST /auth/register
        - POST /auth/login
        - GET /api/profile/:profileId
        - POST /api/verification
        - GET /api/domains/:domain/stats
      data_stores:
        - Firestore
        - Redis
      authentication: None (Acts as the identity provider, issues signed JWT/Paseto tokens)
      deployment_target: GKE Cluster (deafauth-cluster), Google Cloud Run
      current_evidence: Express.js server active in `municipal-dao-v` services directory.
      historical_evidence: Supabase-based reference Next.js implementation in `deafauth` repository.
      confidence: 1.0 (Highly Confirmed, actively referenced and fully written).

